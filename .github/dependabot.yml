# Weekly version updates for the development dependency (Playwright) and the workflow actions.
# The CDN files the report page loads are not npm packages; .github/workflows/cdn.yml updates those.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message: # "build(deps): bump …", per the convention in AGENTS.md
      prefix: build
      include: scope
    ignore: # type definitions stay on Node 20, so the code uses no newer Node API
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: # "ci(deps): bump …"
      prefix: ci
      include: scope
